<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body onload="headerPages()">
    
    <!-- Header -->
    <header class="header">
    </header>


    <section>
        <a href="/AnnerChios/dexiemeanne.html">
            <div class="retour">
                <i class="fa-solid fa-angles-left" style="margin-right: 0.3rem; font-size: 23px;"></i>
                <p>Retour</p>
            </div>
        </a>
        <h1>Sélectionnez l'option</h1>
        <p class="para">Choisissez une option</p>
        <div class="division">

                <div class="radio-button">
                    <input name="radio-group" id="infraRS" class="radio-button__input" type="radio">
                    <label for="infraRS" class="radio-button__label">
                      <span class="radio-button__custom"></span>
                      Option Réseaux et systèmes
                    </label>
                </div>

            <div class="radio-button">
                <input name="radio-group" id="infraCC" class="radio-button__input" type="radio">
                <label for="infraCC" class="radio-button__label">
                  <span class="radio-button__custom"></span>
                  Option Cloud Computing
                </label>
            </div>

            <div class="radio-button">
                <input name="radio-group" id="infraCS" class="radio-button__input" type="radio">
                <label for="infraCS" class="radio-button__label">
                  <span class="radio-button__custom"></span>
                  Option Cyber sécurité
                </label>
            </div>

            <div class="radio-button">
                <input name="radio-group" id="infraIOT" class="radio-button__input" type="radio">
                <label for="infraIOT" class="radio-button__label">
                  <span class="radio-button__custom"></span>
                  Option IOT
                </label>
            </div>
    </div>

    <button class="buttonContinue" onclick="btnCHois2emeinfra()" >
    <span class="button-content">Continue</span>
    </button>

    <div class="errorBtnClick">
        <i class="fa-solid fa-circle-exclamation" style="color: #ffffff; margin-right: 0.6rem; font-size: 20px;"></i>
        <p>Veuillez choisir une option</p>
    </div>
    </section>



    <script src="/scripts.js"></script>
</body>
</html>
