    <div class="content-contect-page">

      <form id="form" action="https://formspree.io/f/myzyobob" method="post">
        <h4>Contactez-<span>nous</span></h4>
        <div class="form-group">
            <label for="nom">Nom</label><br>
          <input
            type="text"
            class="form-control"
            id="nom"
            name="nom"
            placeholder="Name"
            tabindex="1"
            required
          />
        </div>
        <div class="form-group">
            <label for="email">Email</label><br>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="E-Mail Address"
            tabindex="2"
            required
          />
        </div>
        <div class="form-group">
        <label for="message">Message</label><br>
          <textarea
            rows="5"
            cols="50"
            name="message"
            class="form-control"
            id="message"
            placeholder="Your Message..."
            tabindex="5"
            required
          ></textarea>
        </div>

          <button
            type="submit"
            id="button"
            value="Mesajı Gönder"
            class="btn btn-primary"
          >
          <i class="fa-regular fa-paper-plane"></i> Envoyer
          </button>
      </form>

      <img src="/img/Contact us-amico (1).png" class="img-contact" alt="">
    </div>
